name: Build-Test-Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: |
          echo "Running unit tests (TEST_ENV=$TEST_ENV)"
          npm run test:unit

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/
      - name: Run integration tests
        run: |
          echo "Running integration tests (TEST_ENV=$TEST_ENV)"
          npm run test:integration

  deploy-staging:
    needs: test-integration
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/
      - run: |
          echo "✅ All tests passed. Releasing to staging..."
          gh release create "staging-$(date +%s)" dist/* --prerelease --notes "Staging release"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TEST_ENV: prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/
      - run: |
          echo "🚀 Releasing to production (TEST_ENV=$TEST_ENV)"
          gh release create "prod-$(date +%s)" dist/* --notes "Production release"