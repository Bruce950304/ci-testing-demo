name: Build-Test-Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

  test-unit:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    env:
      TEST_ENV: staging
      JEST_JUNIT_OUTPUT_DIR: reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: |
          echo "Running unit tests on ${{ matrix.os }} / Node ${{ matrix.node }}"
          npm run test:unit
      - name: Check coverage threshold
        run: node scripts/check-coverage.js
        env:
          COVERAGE_MIN: 80
      - name: Upload coverage and JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            coverage/
            reports/

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4